global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hw8-monitoring
    service: ml-recommender

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ml_service"
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["ml_service:8000"]
        labels:
          env: dev
          team: ml-platform

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          env: dev

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          env: dev
